<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>0 A.D. (WebAssembly)</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
	#canvas { display: block; width: 100vw; height: 100vh; }
	#status { position: fixed; left: 8px; bottom: 8px; color: #ccc; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
	// Print full stacks for crashes (headless test runs only see console text).
	Error.stackTraceLimit = 60;
	addEventListener('unhandledrejection', (e) => console.error('UNHANDLED ' + (e.reason && e.reason.stack || e.reason)));
	addEventListener('error', (e) => console.error('ERROR ' + (e.error && e.error.stack || e.message)));
	var Module = {
		canvas: document.getElementById('canvas'),
		print: (text) => console.log(text),
		printErr: (text) => console.warn(text),
		setStatus: (text) => { document.getElementById('status').textContent = text; },
		// ?ai=remote runs the AI scripts in a Web Worker (tools/wasm/web-lib.js, ZEROAD_AI_REMOTE).
		preRun: [() => { if (new URLSearchParams(location.search).get('ai') === 'remote') ENV.ZEROAD_AI_REMOTE = '1'; }],
	};
</script>
<script src="pyrogenesis.js"></script>
</body>
</html>
